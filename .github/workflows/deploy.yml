name: Deploy to GitHub Pages

# 公開するのは site/ の Japanese Whisky Guide。旧 Next.js 版はタグ legacy-nextjs-2026-09-18 に残してある
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # テストが通らなければ公開しない
      - name: Test
        run: node --test site/tests/*.check.mjs

      # 公開に必要なファイルだけを集める（テストや裏取りの記録は公開しない）
      - name: Assemble
        run: |
          mkdir -p _site
          cp site/index.html site/404.html site/favicon.svg site/apple-touch-icon.png _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
